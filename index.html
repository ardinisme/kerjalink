<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KerjaLink Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #0d0d0d;
    --paper: #f5f2ee;
    --paper2: #ede9e3;
    --accent: #e84545;
    --accent2: #2563eb;
    --muted: #8a8278;
    --border: rgba(13,13,13,0.1);
    --card: #ffffff;
    --shadow: 0 2px 16px rgba(13,13,13,0.08);
    --radius: 16px;
  }
  .dark {
    --ink: #f0ece6;
    --paper: #111110;
    --paper2: #1a1917;
    --accent: #ff6b6b;
    --accent2: #60a5fa;
    --muted: #6b6760;
    --border: rgba(240,236,230,0.08);
    --card: #1e1d1b;
    --shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 99px; opacity: 0.4; }
  .no-scroll::-webkit-scrollbar { display: none; }
  .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  .font-display { font-family: 'Syne', sans-serif; }
  .font-mono { font-family: 'DM Mono', monospace; }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.6;
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

  .anim-up { animation: fadeUp 0.25s ease-out both; }
  .anim-in { animation: fadeIn 0.2s ease-out both; }
  .anim-shake { animation: shake 0.4s ease-out; }
  .spin { animation: spin 0.8s linear infinite; }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }
  .slide-in { animation: slideIn 0.3s cubic-bezier(0.34,1.2,0.64,1) both; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .card:hover { box-shadow: 0 6px 28px rgba(13,13,13,0.12); }
  .dark .card:hover { box-shadow: 0 6px 28px rgba(0,0,0,0.5); }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 99px;
    padding: 10px 22px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 8px 16px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink); background: var(--paper2); }

  .input-field {
    width: 100%;
    background: var(--paper2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-field:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .input-field::placeholder { color: var(--muted); }

  .tag-chip {
    display: inline-flex; align-items: center;
    background: var(--paper2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.03em;
    font-family: 'DM Mono', monospace;
  }

  .nav-pill {
    padding: 6px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    background: transparent;
    color: var(--muted);
  }
  .nav-pill:hover { color: var(--ink); background: var(--paper2); }
  .nav-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(13,13,13,0.55);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .dark .modal-overlay { background: rgba(0,0,0,0.7); }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 24px 80px rgba(13,13,13,0.2);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .dark .modal-box { box-shadow: 0 24px 80px rgba(0,0,0,0.6); }

  .strength-bar { height: 3px; border-radius: 99px; transition: width 0.3s, background 0.3s; }

  .cred-reveal {
    background: var(--paper2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    letter-spacing: 0.05em;
    word-break: break-all;
  }

  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    transition: all 0.15s;
  }
  .pin-dot.filled { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }

  .lock-key {
    width: 52px; height: 52px;
    background: var(--paper2);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-size: 20px;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.12s;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .lock-key:hover { background: var(--ink); color: var(--paper); transform: scale(1.05); }
  .lock-key:active { transform: scale(0.96); }

  .color-dot {
    width: 18px; height: 18px; border-radius: 50%;
    cursor: pointer; transition: transform 0.15s;
    border: 2px solid transparent;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--ink); transform: scale(1.2); }

  .drag-handle { cursor: grab; }
  .drag-handle:active { cursor: grabbing; }
  .dragging-card { opacity: 0.4; transform: rotate(1deg) scale(0.98); border: 2px dashed var(--accent2) !important; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--ink); color: var(--paper);
    padding: 12px 20px; border-radius: 14px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 32px rgba(13,13,13,0.2);
    max-width: 320px;
    animation: slideIn 0.3s cubic-bezier(0.34,1.2,0.64,1) both;
  }

  /* Accent bar on card */
  .accent-bar { height: 3px; border-radius: 99px 99px 0 0; }

  /* Security badge */
  .sec-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 99px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Favicon circle */
  .favicon-wrap {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--paper2);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* Scrollable modal */
  .modal-box::-webkit-scrollbar { width: 4px; }
  .modal-box::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 99px; }

  .switch-track {
    width: 40px; height: 22px; border-radius: 99px;
    background: var(--paper2); border: 1.5px solid var(--border);
    position: relative; cursor: pointer; transition: background 0.2s;
    flex-shrink: 0;
  }
  .switch-track.on { background: var(--ink); border-color: var(--ink); }
  .switch-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: transform 0.2s, background 0.2s;
  }
  .switch-track.on .switch-thumb { transform: translateX(18px); background: var(--paper); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px; gap: 12px; text-align: center;
  }

  /* Responsive grid */
  .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  @media (max-width: 640px) {
    .link-grid { grid-template-columns: 1fr; }
    .modal-box { max-width: 100%; border-radius: 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback, useRef } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────
const SENTINEL = "KERJALINK_PRO_V2_VERIFIED";
const AUTO_LOCK_MS = 15 * 60 * 1000;
const MAX_PIN_ATTEMPTS = 5;
const LOCKOUT_MS = 60 * 1000; // 1 menit lockout

const COLORS = [
  { id: 'slate',   dot: '#94a3b8', bar: '#94a3b8' },
  { id: 'red',     dot: '#ef4444', bar: '#ef4444' },
  { id: 'orange',  dot: '#f97316', bar: '#f97316' },
  { id: 'amber',   dot: '#f59e0b', bar: '#f59e0b' },
  { id: 'emerald', dot: '#10b981', bar: '#10b981' },
  { id: 'blue',    dot: '#3b82f6', bar: '#3b82f6' },
  { id: 'violet',  dot: '#8b5cf6', bar: '#8b5cf6' },
  { id: 'rose',    dot: '#f43f5e', bar: '#f43f5e' },
];

const DEFAULT_CATS = [
  { id: 'utama',      name: 'Utama',      hidden: false },
  { id: 'kredensial', name: 'Kredensial', hidden: false },
  { id: 'referensi',  name: 'Referensi',  hidden: false },
  { id: 'lainnya',    name: 'Lainnya',    hidden: false },
];

const GAS_TEMPLATE = `function doGet(e) {
  const store = PropertiesService.getScriptProperties();
  return ContentService.createTextOutput(JSON.stringify({
    links: JSON.parse(store.getProperty('links') || '[]'),
    categories: JSON.parse(store.getProperty('categories') || '[]'),
    meta: JSON.parse(store.getProperty('meta') || '{}')
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  const data = JSON.parse(e.postData.contents);
  const store = PropertiesService.getScriptProperties();
  if (data.links !== undefined) store.setProperty('links', JSON.stringify(data.links));
  if (data.categories !== undefined) store.setProperty('categories', JSON.stringify(data.categories));
  if (data.meta !== undefined) store.setProperty('meta', JSON.stringify(data.meta));
  return ContentService.createTextOutput(JSON.stringify({ ok: true }));
}`;

// ─── CRYPTO UTILS ─────────────────────────────────────────────────
const deriveKey = (pin, salt) => {
  return CryptoJS.PBKDF2(pin, salt, { keySize: 256/32, iterations: 1000 }).toString();
};

const encrypt = (text, pin, salt) => {
  if (!text) return '';
  const key = deriveKey(pin, salt);
  return CryptoJS.AES.encrypt(text, key).toString();
};

const decrypt = (cipher, pin, salt) => {
  if (!cipher) return '';
  try {
    const key = deriveKey(pin, salt);
    const bytes = CryptoJS.AES.decrypt(cipher, key);
    return bytes.toString(CryptoJS.enc.Utf8) || '';
  } catch { return ''; }
};

const makeSalt = () => CryptoJS.lib.WordArray.random(128/8).toString();
const hashPin = (pin) => CryptoJS.SHA256(pin + 'KL_PRO_SALT').toString();

// Normalisasi kategori — menghindari duplikasi ID saat generate massal
const normalizeCats = (raw) => {
  if (!raw || !Array.isArray(raw) || raw.length === 0) return DEFAULT_CATS;
  return raw.map((c, index) => {
    if (typeof c === 'string') return { id: c.toLowerCase().replace(/\s+/g,'-'), name: c, hidden: false };
    return { 
      id: c.id || c.name?.toLowerCase().replace(/\s+/g,'-') || (Date.now() + index).toString(36), 
      name: c.name || c.id, 
      hidden: c.hidden || c.isHidden || false 
    };
  });
};

const normalizeLinks = (rawLinks, normalizedCats) => {
  if (!rawLinks || !Array.isArray(rawLinks)) return [];
  return rawLinks.map(l => {
    if (l.category && !l.cat) {
      const matched = normalizedCats.find(c => c.name === l.category);
      return { ...l, cat: matched ? matched.id : (normalizedCats[0]?.id || 'lainnya'), category: undefined };
    }
    return l;
  });
};

const migrateMeta = (rawMeta, pin) => {
  if (rawMeta?.pinHash) return rawMeta;
  if (rawMeta?.pinCheck) {
    try {
      const bytes = CryptoJS.AES.decrypt(rawMeta.pinCheck, pin);
      const plain = bytes.toString(CryptoJS.enc.Utf8);
      if (plain && plain.includes('KERJALINK')) {
        const salt = makeSalt();
        const pinHash = hashPin(pin);
        const pinCheck = encrypt('KERJALINK_PRO_V2_VERIFIED', pin, salt);
        return { pinHash, salt, pinCheck, migratedFrom: 'v1' };
      }
    } catch {}
    return null;
  }
  return null;
};

const getDomain = (url) => { try { return new URL(url).hostname; } catch { return url; } };
const normalizeUrl = (url) => url && !url.match(/^https?:\/\//) ? 'https://' + url : url;

const passwordStrength = (pw) => {
  if (!pw) return 0;
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  return score;
};

const strengthLabel = (s) => ['', 'Sangat Lemah', 'Lemah', 'Sedang', 'Kuat', 'Sangat Kuat'][s] || '';
const strengthColor = (s) => ['', '#ef4444','#f97316','#f59e0b','#10b981','#3b82f6'][s] || '#ef4444';

// ─── LOCAL STORAGE HELPERS ────────────────────────────────────────
const LS = {
  get: (k, fallback = null) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};

// ─── SVG ICONS ────────────────────────────────────────────────────
const I = {
  Plus:       (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  Search:     (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Link:       (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
  Copy:       (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
  Edit:       (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  Trash:      (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
  Settings:   (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  X:          (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  Check:      (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Shield:     (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  Cloud:      (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
  CloudOff:   (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
  Refresh:    (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
