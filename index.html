// ─── TOAST ────────────────────────────────────────────────────────
function Toast({ msg, type = 'ok' }) {
  const icon = type === 'err' ? <I.X style={{width:14,height:14,color:'#ff6b6b'}} /> : <I.Check style={{width:14,height:14,color:'#10b981'}} />;
  return <div className="toast">{icon}<span>{msg}</span></div>;
}

// ─── PIN KEYPAD ───────────────────────────────────────────────────
function PinKeypad({ value, onChange, maxLen = 6 }) {
  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','↵'];
  const handleKey = (k) => {
    if (k === '⌫') onChange(value.slice(0, -1));
    else if (k === '↵') return; 
    else if (value.length < maxLen) onChange(value + k);
  };
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'center', gap:10, marginBottom:20 }}>
        {Array.from({length: maxLen}).map((_,i) => (
          <div key={i} className={`pin-dot ${i < value.length ? 'filled' : ''}`} />
        ))}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
        {keys.map(k => (
          <button key={k} className="lock-key" onClick={() => handleKey(k)}
            style={{ fontFamily: k === '⌫' || k === '↵' ? 'sans-serif' : undefined }}>
            {k}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── SWITCH ───────────────────────────────────────────────────────
function Switch({ on, onChange }) {
  return (
    <div className={`switch-track ${on ? 'on' : ''}`} onClick={() => onChange(!on)} role="checkbox" aria-checked={on}>
      <div className="switch-thumb" />
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────
function App() {
  // ── Theme ──
  const [dark, setDark] = useState(() => LS.get('kl_theme') === 'dark');
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    LS.set('kl_theme', dark ? 'dark' : 'light');
  }, [dark]);

  // ── Persisted state ──
  const [links, setLinks] = useState(() => LS.get('kl_links', []));
  const [cats, setCats] = useState(() => {
    const stored = LS.get('kl_cats');
    if (!stored || !stored.length) return DEFAULT_CATS;
    return stored.map(c => typeof c === 'string'
      ? { id: c.toLowerCase(), name: c, hidden: false }
      : { ...c, hidden: c.hidden || false });
  });

  // ── Cloud / Security ──
  const [syncUrl, setSyncUrl] = useState(() => LS.get('kl_syncUrl', ''));
  const [encMeta, setEncMeta] = useState(() => LS.get('kl_meta', {}));
  const [sessionPin, setSessionPin] = useState('');
  const [pinAttempts, setPinAttempts] = useState(0);
  const [lockedUntil, setLockedUntil] = useState(0);

  // ── UI State ──
  const [toast, setToast] = useState(null);
  const [search, setSearch] = useState('');
  const [selectedCat, setSelectedCat] = useState('all');
  const [viewMode, setViewMode] = useState('grid');
  const [isSyncing, setIsSyncing] = useState(false);
  const [dragLinkId, setDragLinkId] = useState(null);
  const [dragCatId, setDragCatId] = useState(null);
  const [activeCredId, setActiveCredId] = useState(null);
  const [showPw, setShowPw] = useState({});

  // ── Modals ──
  const [modal, setModal] = useState(null); 
  const [editingLink, setEditingLink] = useState(null);
  const [conflictData, setConflictData] = useState(null);

  // ── Link Form ──
  const emptyForm = { title:'', url:'', cat: cats[0]?.id || 'lainnya', tags:'', desc:'', color:'slate', pinned:false, username:'', password:'' };
  const [form, setForm] = useState(emptyForm);
  const [showFormPw, setShowFormPw] = useState(false);
  const pwStrength = passwordStrength(form.password);

  // ── Category Form ──
  const [newCatName, setNewCatName] = useState('');
  const [editCatId, setEditCatId] = useState(null);
  const [editCatVal, setEditCatVal] = useState('');

  // ── Cloud Form ──
  const [cloudForm, setCloudForm] = useState({ url:'', pin:'' });

  // ── Settings Form ──
  const [settingsForm, setSettingsForm] = useState({ oldPin:'', newPin:'', confirmPin:'' });
  const [showSettingsPw, setShowSettingsPw] = useState({});
  const [autoLockMin, setAutoLockMin] = useState(() => LS.get('kl_autolock', 15));

  // ── Auto-lock ──
  useEffect(() => {
    if (!syncUrl || !sessionPin) return;
    const ms = autoLockMin * 60 * 1000;
    let tid;
    const reset = () => { clearTimeout(tid); tid = setTimeout(() => { setSessionPin(''); notify('Terkunci otomatis karena tidak aktif.'); }, ms); };
    const evts = ['mousemove','keydown','scroll','touchstart','click'];
    evts.forEach(e => window.addEventListener(e, reset));
    reset();
    return () => { evts.forEach(e => window.removeEventListener(e, reset)); clearTimeout(tid); };
  }, [syncUrl, sessionPin, autoLockMin]);

  // ── Helpers ──
  const notify = useCallback((msg, type = 'ok') => {
    setToast({ msg, type }); 
    setTimeout(() => setToast(null), 3500);
  }, []);

  const copy = useCallback((text, label) => {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    notify(`${label} disalin!`);
  }, [notify]);

  const persist = useCallback((newLinks, newCats) => {
    LS.set('kl_links', newLinks);
    LS.set('kl_cats', newCats);
    setLinks(newLinks);
    setCats(newCats);
    if (syncUrl && sessionPin) syncToCloud(newLinks, newCats, syncUrl, encMeta);
  }, [syncUrl, sessionPin, encMeta]);

  // ── Cloud Sync ──
  const syncToCloud = async (l, c, url, meta) => {
    if (!url) return;
    setIsSyncing(true);
    try {
      await fetch(url, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ links: l, categories: c, meta })
      });
    } catch(e) { console.warn('Cloud sync failed', e); }
    finally { setIsSyncing(false); }
  };

  const fetchFromCloud = async (url) => {
    const res = await fetch(url);
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { throw new Error('URL bukan endpoint JSON yang valid.'); }
    return data;
  };

  const handleConnectCloud = async () => {
    const { url, pin } = cloudForm;
    if (!url.trim() || pin.length < 4 || pin.length > 6) return notify('URL & PIN (4-6 karakter) wajib diisi.', 'err');
    setIsSyncing(true);
    try {
      const data = await fetchFromCloud(url.trim());

      const rawCats = data.categories || data.cats || [];
      const cloudCats = normalizeCats(rawCats.length ? rawCats : null);
      const rawMeta = data.meta || {};

      const hasExistingData = (data.links && data.links.length > 0) || rawMeta.pinHash || rawMeta.pinCheck;

      if (!hasExistingData) {
        const salt = makeSalt();
        const newMeta = { pinHash: hashPin(pin), salt, pinCheck: encrypt(SENTINEL, pin, salt) };
        applyCloud(links, cats, url.trim(), pin, newMeta);
        return;
      }

      let verifiedMeta = null;

      if (rawMeta.pinHash) {
        if (hashPin(pin) !== rawMeta.pinHash) throw new Error('PIN salah! Tidak cocok dengan database ini.');
        verifiedMeta = rawMeta;
      } else if (rawMeta.pinCheck) {
        verifiedMeta = migrateMeta(rawMeta, pin);
        if (!verifiedMeta) throw new Error('PIN salah! Tidak cocok dengan database ini.');
      } else {
        const salt = makeSalt();
        verifiedMeta = { pinHash: hashPin(pin), salt, pinCheck: encrypt(SENTINEL, pin, salt) };
      }

      const cloudLinks = normalizeLinks(data.links || [], cloudCats);

      if (links.length > 0) {
        setConflictData({ cloudLinks, cloudCats, meta: verifiedMeta, pin, url: url.trim() });
        setModal('conflict');
      } else {
        applyCloud(cloudLinks, cloudCats, url.trim(), pin, verifiedMeta);
      }
    } catch(e) { notify(e.message || 'Gagal menyambungkan ke Cloud.', 'err'); }
    finally { setIsSyncing(false); }
  };

  const applyCloud = (l, c, url, pin, meta) => {
    const normC = normalizeCats(c);
    const normL = normalizeLinks(l, normC);
    setLinks(normL); setCats(normC); setSyncUrl(url); setSessionPin(pin); setEncMeta(meta);
    LS.set('kl_links', normL); LS.set('kl_cats', normC);
    LS.set('kl_syncUrl', url); LS.set('kl_meta', meta);
    syncToCloud(normL, normC, url, meta);
    setModal(null); setConflictData(null);
    notify('Tersambung & tersinkronisasi ke Cloud!');
  };

  const resolveConflict = (mode) => {
    if (!conflictData) return;
    const { cloudLinks, cloudCats, meta, pin, url } = conflictData;
    if (mode === 'merge') {
      const merged = [...links, ...cloudLinks.filter(cl => !links.find(l => l.id === cl.id))];
      const catMap = new Map();
      cats.forEach(c => catMap.set(c.id, c));
      cloudCats.forEach(c => catMap.set(c.id, c));
      applyCloud(merged, Array.from(catMap.values()), url, pin, meta);
    } else {
      applyCloud(cloudLinks, cloudCats, url, pin, meta);
    }
  };

  const handleUnlock = (pin) => {
    if (Date.now() < lockedUntil) { notify(`Terlalu banyak percobaan. Tunggu ${Math.ceil((lockedUntil - Date.now())/1000)}s.`, 'err'); return; }
    const meta = encMeta;
    const ok = meta.pinHash
      ? hashPin(pin) === meta.pinHash
      : decrypt(meta.pinCheck, pin, meta.salt) === SENTINEL;
    if (ok) {
      setSessionPin(pin); setPinAttempts(0); setLockedUntil(0);
      if (syncUrl) fetchFromCloud(syncUrl).then(data => {
        if (data.links) { setLinks(data.links); LS.set('kl_links', data.links); }
        if (data.categories) { setCats(data.categories); LS.set('kl_cats', data.categories); }
      }).catch(() => {});
    } else {
      const next = pinAttempts + 1;
      setPinAttempts(next);
      if (next >= MAX_PIN_ATTEMPTS) {
        setLockedUntil(Date.now() + LOCKOUT_MS);
        setPinAttempts(0);
        notify(`PIN salah ${MAX_PIN_ATTEMPTS}x. Terkunci 60 detik.`, 'err');
      } else {
        notify(`PIN salah! ${MAX_PIN_ATTEMPTS - next} percobaan tersisa.`, 'err');
      }
    }
  };

  const handleDisconnect = () => {
    if (!window.confirm('Putuskan Cloud? Beralih ke Mode Offline.')) return;
    setSyncUrl(''); setSessionPin('');
    LS.del('kl_syncUrl'); LS.del('kl_meta');
    setModal(null); notify('Beralih ke Mode Offline.');
  };

  // ── Change PIN ──
  const handleChangePin = () => {
    const { oldPin, newPin, confirmPin } = settingsForm;
    if (newPin !== confirmPin) return notify('Konfirmasi PIN tidak cocok!', 'err');
    if (newPin.length < 4 || newPin.length > 6) return notify('PIN baru harus 4-6 karakter.', 'err');
    if (hashPin(oldPin) !== encMeta.pinHash) return notify('PIN lama salah!', 'err');

    const salt = makeSalt();
    const pinHash = hashPin(newPin);
    const pinCheck = encrypt(SENTINEL, newPin, salt);
    const newMeta = { pinHash, salt, pinCheck };

    const newLinks = links.map(l => {
      if (!l.hasCreds) return l;
      const u = decrypt(l.encUser, oldPin, encMeta.salt);
      const p = decrypt(l.encPass, oldPin, encMeta.salt);
      return { ...l, encUser: encrypt(u, newPin, salt), encPass: encrypt(p, newPin, salt) };
    });

    setEncMeta(newMeta); setSessionPin(newPin);
    LS.set('kl_meta', newMeta);
    persist(newLinks, cats);
    syncToCloud(newLinks, cats, syncUrl, newMeta);
    setSettingsForm({ oldPin:'', newPin:'', confirmPin:'' });
    setModal(null);
    notify('PIN & enkripsi berhasil diperbarui!');
  };

  // ── Export / Import ──
  const handleExport = () => {
    const data = { version: 2, links, cats, meta: encMeta };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `KerjaLink_Pro_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    notify('Backup berhasil diunduh!');
  };

  const handleImport = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d.links || !d.cats) return notify('Format file tidak valid.', 'err');
        setLinks(d.links); setCats(d.cats);
        LS.set('kl_links', d.links); LS.set('kl_cats', d.cats);
        if (d.meta) { setEncMeta(d.meta); LS.set('kl_meta', d.meta); setSessionPin(''); }
        setModal(null);
        notify('Data berhasil dipulihkan!');
      } catch { notify('Gagal membaca file.', 'err'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // ── Link CRUD ──
  const openAdd = () => {
    setEditingLink(null);
    const catId = selectedCat !== 'all' ? selectedCat : (cats.find(c => !c.hidden)?.id || 'lainnya');
    setForm({ ...emptyForm, cat: catId });
    setShowFormPw(false);
    setModal('link');
  };

  const openEdit = (link) => {
    setEditingLink(link);
    setForm({
      title: link.title, url: link.url, cat: link.cat,
      tags: (link.tags || []).join(', '), desc: link.desc || '',
      color: link.color || 'slate', pinned: link.pinned || false,
      username: sessionPin ? decrypt(link.encUser, sessionPin, encMeta.salt) : '',
      password: sessionPin ? decrypt(link.encPass, sessionPin, encMeta.salt) : '',
    });
    setShowFormPw(false);
    setModal('link');
  };

  const saveLink = () => {
    if (!form.title.trim() || !form.url.trim()) return notify('Judul & URL wajib diisi.', 'err');
    const finalUrl = normalizeUrl(form.url.trim());
    const tags = form.tags.split(',').map(t => t.trim()).filter(Boolean);
    const hasCreds = !!(syncUrl && sessionPin && (form.username || form.password));
    const encUser = hasCreds ? encrypt(form.username, sessionPin, encMeta.salt) : '';
    const encPass = hasCreds ? encrypt(form.password, sessionPin, encMeta.salt) : '';

    const linkData = { title: form.title.trim(), url: finalUrl, cat: form.cat, tags, desc: form.desc.trim(), color: form.color, pinned: form.pinned, hasCreds, encUser, encPass };

    const newLinks = editingLink
      ? links.map(l => l.id === editingLink.id ? { ...l, ...linkData, updatedAt: Date.now() } : l)
      : [{ id: Date.now().toString(36) + Math.random().toString(36).slice(2), createdAt: Date.now(), ...linkData }, ...links];

    persist(newLinks, cats);
    setModal(null);
    notify(editingLink ? 'Link diperbarui!' : 'Link ditambahkan!');
  };

  const deleteLink = (id) => {
    if (!window.confirm('Hapus tautan ini?')) return;
    persist(links.filter(l => l.id !== id), cats);
    notify('Dihapus.');
  };

  const togglePin = useCallback((id) => {
    const newLinks = links.map(l => l.id === id ? { ...l, pinned: !l.pinned } : l);
    persist(newLinks, cats);
  }, [links, cats, persist]);

  // ── Cat CRUD ──
  const addCat = () => {
    const name = newCatName.trim(); if (!name) return;
    if (cats.some(c => c.name.toLowerCase() === name.toLowerCase())) return notify('Kategori sudah ada.', 'err');
    const id = name.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now().toString(36);
    persist(links, [...cats, { id, name, hidden: false }]);
    setNewCatName('');
    notify('Kategori ditambahkan!');
  };

  const saveEditCat = (id) => {
    const name = editCatVal.trim();
    if (!name) { setEditCatId(null); return; }
    if (cats.some(c => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) return notify('Nama sudah dipakai.', 'err');
    const newCats = cats.map(c => c.id === id ? { ...c, name } : c);
    persist(links, newCats); // Removed redundant array map on newLinks
    setEditCatId(null);
  };

  const deleteCat = (id) => {
    const cat = cats.find(c => c.id === id);
    if (cat?.name === 'Lainnya') return notify('Kategori Lainnya tidak bisa dihapus.', 'err');
    if (!window.confirm(`Hapus kategori "${cat?.name}"? Link akan pindah ke Lainnya.`)) return;
    const fallback = cats.find(c => c.name === 'Lainnya')?.id || cats.find(c => c.id !== id)?.id;
    const newLinks = links.map(l => l.cat === id ? { ...l, cat: fallback || l.cat } : l);
    persist(newLinks, cats.filter(c => c.id !== id));
    if (selectedCat === id) setSelectedCat('all');
  };

  const toggleHideCat = (id) => {
    const cat = cats.find(c => c.id === id);
    if (cat?.name === 'Lainnya') return notify('Kategori sistem tidak bisa disembunyikan.', 'err');
    persist(links, cats.map(c => c.id === id ? { ...c, hidden: !c.hidden } : c));
    if (selectedCat === id) setSelectedCat('all');
  };

  // ── Drag & Drop ──
  const handleLinkDrop = (targetId) => {
    if (!dragLinkId || dragLinkId === targetId) { setDragLinkId(null); return; }
    const arr = [...links];
    const fi = arr.findIndex(l => l.id === dragLinkId), ti = arr.findIndex(l => l.id === targetId);
    if (fi < 0 || ti < 0) return;
    const [item] = arr.splice(fi, 1); arr.splice(ti, 0, item);
    persist(arr, cats); setDragLinkId(null);
  };

  const handleCatDrop = (targetId) => {
    if (!dragCatId || dragCatId === targetId) { setDragCatId(null); return; }
    const arr = [...cats];
    const fi = arr.findIndex(c => c.id === dragCatId), ti = arr.findIndex(c => c.id === targetId);
    if (fi < 0 || ti < 0) return;
    const [item] = arr.splice(fi, 1); arr.splice(ti, 0, item);
    persist(links, arr); setDragCatId(null);
  };

  // ── Filtered / sorted links ──
  const hiddenCatIds = useMemo(() => cats.filter(c => c.hidden).map(c => c.id), [cats]);
  const visibleCats = useMemo(() => cats.filter(c => !c.hidden), [cats]);

  const filteredLinks = useMemo(() => {
    const q = search.toLowerCase();
    return links
      .filter(l => {
        const matchCat = selectedCat === 'all' ? !hiddenCatIds.includes(l.cat) : l.cat === selectedCat;
        if (!matchCat) return false;
        if (!q) return true;
        return l.title?.toLowerCase().includes(q) || l.desc?.toLowerCase().includes(q) || (l.tags || []).some(t => t.toLowerCase().includes(q)) || getDomain(l.url).includes(q);
      })
      .sort((a,b) => (a.pinned === b.pinned ? 0 : a.pinned ? -1 : 1));
  }, [links, search, selectedCat, hiddenCatIds]);

  const isCloudLocked = Boolean(syncUrl) && !sessionPin;
  const catName = (id) => cats.find(c => c.id === id)?.name || id;
  const colorDot = (id) => COLORS.find(c => c.id === id)?.dot || '#94a3b8';

  // ─── LOCK SCREEN ────────────────────────────────────────────────
  if (isCloudLocked) {
    const isLockedOut = Date.now() < lockedUntil;
    const [pinInput, setPinInput] = useState('');
    const doUnlock = () => { if (pinInput.length >= 4) { handleUnlock(pinInput); setPinInput(''); } };

    return (
      <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:20, position:'relative' }}>
        <button onClick={() => { if(window.confirm('Beralih ke Mode Offline?')) { setSyncUrl(''); LS.del('kl_syncUrl'); } }}
          className="btn-ghost" style={{ position:'absolute', top:24, right:24, fontSize:12 }}>
          Mode Offline
        </button>
        <div className="card anim-up" style={{ padding:'48px 36px', maxWidth:380, width:'100%', textAlign:'center' }}>
          <div style={{ width:56, height:56, background:'var(--paper2)', borderRadius:16, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 24px', border:'1px solid var(--border)' }}>
            <I.Lock style={{ width:26, height:26, color:'var(--muted)' }} />
          </div>
          <h2 className="font-display" style={{ fontSize:24, marginBottom:8 }}>Buka Brankas</h2>
          <p style={{ color:'var(--muted)', fontSize:14, marginBottom:32, lineHeight:1.6 }}>Masukkan PIN keamanan Anda untuk mengakses data terenkripsi.</p>

          {isLockedOut ? (
            <div style={{ padding:'16px', background:'var(--paper2)', borderRadius:12, color:'var(--muted)', fontSize:13 }}>
              <I.Lock style={{width:18,height:18,marginBottom:8,margin:'0 auto 8px'}} />
              <p>Terlalu banyak percobaan gagal. Silakan tunggu dan coba lagi.</p>
            </div>
          ) : (
            <PinKeypad value={pinInput} onChange={setPinInput} maxLen={6} />
          )}

          {!isLockedOut && (
            <button className="btn-primary" style={{ width:'100%', marginTop:20, justifyContent:'center' }} onClick={doUnlock} disabled={pinInput.length < 4}>
              Buka Kunci
            </button>
          )}

          {pinAttempts > 0 && !isLockedOut && (
            <p style={{ marginTop:12, fontSize:12, color:'var(--accent)' }}>
              {MAX_PIN_ATTEMPTS - pinAttempts} percobaan tersisa
            </p>
          )}
        </div>
        {toast && <Toast msg={toast.msg} type={toast.type} />}
      </div>
    );
  }

  // ─── CONFLICT SCREEN ─────────────────────────────────────────────
  if (modal === 'conflict' && conflictData) {
    return (
      <div className="modal-overlay anim-in">
        <div className="modal-box anim-up" style={{ padding:36 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
            <div style={{ padding:10, background:'rgba(245,158,11,0.12)', borderRadius:12 }}>
              <I.Warn style={{ width:22, height:22, color:'#f59e0b' }} />
            </div>
            <div>
              <h3 className="font-display" style={{ fontSize:18 }}>Konflik Data Terdeteksi</h3>
              <p style={{ fontSize:13, color:'var(--muted)' }}>Pilih bagaimana menggabungkan data</p>
            </div>
          </div>
          <p style={{ fontSize:14, color:'var(--muted)', marginBottom:20, lineHeight:1.7 }}>
            Ditemukan <strong style={{color:'var(--ink)'}}>{links.length} link</strong> di perangkat ini dan <strong style={{color:'var(--ink)'}}>{conflictData.cloudLinks.length} link</strong> di Cloud.
          </p>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            <button onClick={() => resolveConflict('merge')} style={{ padding:'16px', border:'2px solid #10b981', borderRadius:14, background:'rgba(16,185,129,0.06)', textAlign:'left', cursor:'pointer', color:'var(--ink)' }}>
              <div style={{ fontWeight:700, fontSize:14, color:'#059669', marginBottom:4 }}>Gabungkan Semua</div>
              <div style={{ fontSize:12, color:'var(--muted)' }}>Data lokal + Cloud digabung. Tidak ada yang hilang.</div>
            </button>
            <button onClick={() => resolveConflict('replace')} style={{ padding:'16px', border:'2px solid var(--border)', borderRadius:14, background:'var(--paper2)', textAlign:'left', cursor:'pointer', color:'var(--ink)' }}>
              <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>Gunakan Data Cloud</div>
              <div style={{ fontSize:12, color:'var(--muted)' }}>Data lokal akan ditimpa. Data Cloud menjadi sumber utama.</div>
            </button>
            <button onClick={() => { setModal(null); setConflictData(null); }} style={{ padding:'12px', background:'transparent', border:'none', cursor:'pointer', color:'var(--muted)', fontSize:13, fontWeight:600 }}>Batalkan</button>
          </div>
        </div>
        {toast && <Toast msg={toast.msg} type={toast.type} />}
      </div>
    );
  }

  // ─── MAIN APP UI ─────────────────────────────────────────────────
  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', position:'relative', zIndex:1 }}>

      {/* ── HEADER ── */}
      <header style={{ background:'var(--card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:30 }}>
        <div style={{ maxWidth:1200, margin:'0 auto', padding:'0 20px', height:60, display:'flex', alignItems:'center', gap:16 }}>

          {/* Logo */}
          <div className="font-display" style={{ fontSize:18, fontWeight:800, letterSpacing:'-0.02em', display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
            <div style={{ width:28, height:28, background:'var(--ink)', borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <I.Shield style={{ width:14, height:14, color:'var(--paper)' }} />
            </div>
            KerjaLink<span style={{ color:'var(--accent)' }}>Pro</span>
          </div>

          {/* Search */}
          <div style={{ flex:1, maxWidth:480, position:'relative' }}>
            <I.Search style={{ width:15, height:15, position:'absolute', left:13, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', pointerEvents:'none' }} />
            <input className="input-field" style={{ paddingLeft:38, height:38, fontSize:13 }}
              placeholder="Cari judul, tag, domain..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>

          {/* Actions */}
          <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
            <button onClick={() => setDark(!dark)} className="btn-ghost" style={{ padding:'7px 10px', gap:0 }}>
              {dark ? <I.Sun style={{width:16,height:16}} /> : <I.Moon style={{width:16,height:16}} />}
            </button>

            <button onClick={() => setViewMode(v => v === 'grid' ? 'list' : 'grid')} className="btn-ghost" style={{ padding:'7px 10px', gap:0 }}>
              {viewMode === 'grid' ? <I.List style={{width:16,height:16}} /> : <I.Grid style={{width:16,height:16}} />}
            </button>

            <button onClick={() => { setCloudForm({ url: syncUrl, pin:'' }); setModal('cloud'); }}
              className="btn-ghost"
              style={{ padding:'7px 12px', color: syncUrl ? '#10b981' : undefined, borderColor: syncUrl ? '#10b981' : undefined, position:'relative' }}>
              {isSyncing ? <I.Refresh style={{width:16,height:16}} className="spin" /> : syncUrl ? <I.Cloud style={{width:16,height:16}} /> : <I.CloudOff style={{width:16,height:16}} />}
              <span style={{ fontSize:12, display:'none' }} className="sm-show">Cloud</span>
              {syncUrl && <span style={{ position:'absolute', top:6, right:6, width:6, height:6, background:'#10b981', borderRadius:'50%', border:'1.5px solid var(--card)' }} />}
            </button>

            <button onClick={() => { setSettingsForm({oldPin:'',newPin:'',confirmPin:''}); setShowSettingsPw({}); setModal('settings'); }} className="btn-ghost" style={{ padding:'7px 10px', gap:0 }}>
              <I.Settings style={{width:16,height:16}} />
            </button>

            <button onClick={openAdd} className="btn-primary" style={{ padding:'8px 16px', fontSize:13 }}>
              <I.Plus style={{width:15,height:15}} /> Link
            </button>
          </div>
        </div>

        {/* Category tabs */}
        <div style={{ borderTop:'1px solid var(--border)' }}>
          <div className="no-scroll" style={{ maxWidth:1200, margin:'0 auto', padding:'0 20px', display:'flex', gap:4, overflowX:'auto', alignItems:'center', height:44 }}>
            {['all', ...visibleCats.map(c => c.id)].map(id => (
              <button key={id} className={`nav-pill ${selectedCat === id ? 'active' : ''}`}
                onClick={() => setSelectedCat(id)}>
                {id === 'all' ? 'Semua' : catName(id)}
                {id !== 'all' && (
                  <span style={{ marginLeft:4, fontSize:11, opacity:0.6 }}>
                    {links.filter(l => l.cat === id).length}
                  </span>
                )}
              </button>
            ))}
            <button onClick={() => setModal('cat')} className="btn-ghost" style={{ padding:'5px 12px', fontSize:12, marginLeft:4, flexShrink:0 }}>
              + Kelola
            </button>
          </div>
        </div>
      </header>

      {/* ── MAIN CONTENT ── */}
      <main style={{ flex:1, maxWidth:1200, margin:'0 auto', width:'100%', padding:'24px 20px' }}>

        {/* Stats bar */}
        <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:20, fontSize:13, color:'var(--muted)' }}>
          <span>{filteredLinks.length} tautan{search && ` untuk "${search}"`}</span>
          {syncUrl && sessionPin && (
            <span className="sec-badge" style={{ background:'rgba(16,185,129,0.1)', color:'#059669', border:'1px solid rgba(16,185,129,0.2)' }}>
              <I.Shield style={{width:10,height:10}} /> Terenkripsi
            </span>
          )}
          {!syncUrl && (
            <span className="sec-badge" style={{ background:'var(--paper2)', color:'var(--muted)', border:'1px solid var(--border)' }}>
              <I.CloudOff style={{width:10,height:10}} /> Offline
            </span>
          )}
        </div>

        {filteredLinks.length === 0 ? (
          <div className="empty-state anim-up">
            <div style={{ width:64, height:64, background:'var(--paper2)', borderRadius:20, display:'flex', alignItems:'center', justifyContent:'center', border:'1px solid var(--border)' }}>
              {search ? <I.Search style={{width:28,height:28,color:'var(--muted)'}} /> : <I.Link style={{width:28,height:28,color:'var(--muted)'}} />}
            </div>
            <div>
              <h3 className="font-display" style={{ fontSize:18, marginBottom:6 }}>{search ? 'Tidak Ditemukan' : 'Belum Ada Link'}</h3>
              <p style={{ color:'var(--muted)', fontSize:14 }}>{search ? `Tidak ada hasil untuk "${search}"` : 'Klik "+ Link" untuk menambahkan tautan pertama.'}</p>
            </div>
            {!search && <button onClick={openAdd} className="btn-primary">+ Tambah Link Pertama</button>}
          </div>
        ) : (
          <div className={viewMode === 'grid' ? 'link-grid' : ''} style={viewMode === 'list' ? { display:'flex', flexDirection:'column', gap:8 } : {}}>
            {filteredLinks.map((link, idx) => {
              const domain = getDomain(link.url);
              const color = COLORS.find(c => c.id === link.color) || COLORS[0];
              const isCredOpen = activeCredId === link.id;
              const catLabel = catName(link.cat);

              return (
                <div key={link.id}
                  draggable
                  onDragStart={e => { setDragLinkId(link.id); e.dataTransfer.effectAllowed='move'; }}
                  onDragOver={e => e.preventDefault()}
                  onDrop={() => handleLinkDrop(link.id)}
                  onDragEnd={() => setDragLinkId(null)}
                  className={`card anim-up ${dragLinkId === link.id ? 'dragging-card' : ''}`}
                  style={{ padding:0, overflow:'hidden', animationDelay:`${idx*0.04}s`, display:'flex', flexDirection:'column' }}
                >
                  {/* Color bar */}
                  <div style={{ height:3, background:color.dot, borderRadius:'16px 16px 0 0' }} />

                  <div style={{ padding:'14px 16px', flex:1, display:'flex', flexDirection:'column', gap:12 }}>
                    {/* Top row */}
                    <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
                      <div className="drag-handle" title="Geser" style={{ color:'var(--border)', marginTop:2, flexShrink:0 }}>
                        <I.Grip style={{width:14,height:14}} />
                      </div>
                      <div className="favicon-wrap">
                        <img
                          src={`https://www.google.com/s2/favicons?domain=${domain}&sz=64`}
                          alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }}
                          onError={e => { e.target.style.display='none'; e.target.parentElement.textContent = domain[0]?.toUpperCase() || '?'; }}
                        />
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:'flex', alignItems:'start', justifyContent:'space-between', gap:6 }}>
                          <h3 style={{ fontWeight:700, fontSize:15, lineHeight:1.3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1 }} title={link.title}>
                            {link.title}
                          </h3>
                          {link.pinned && <I.Star style={{ width:13, height:13, color:'#f59e0b', flexShrink:0 }} filled />}
                        </div>
                        <p style={{ fontSize:12, color:'var(--muted)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginTop:2 }}>
                          {link.desc || domain}
                        </p>
                      </div>
                    </div>

                    {/* Tags */}
                    {link.tags?.length > 0 && (
                      <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                        {link.tags.map(t => <span key={t} className="tag-chip">#{t}</span>)}
                      </div>
                    )}

                    {/* Category badge */}
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                      <span className="tag-chip" style={{ color: color.dot, borderColor: color.dot + '44', background: color.dot + '11' }}>
                        {catLabel}
                      </span>
                      {link.hasCreds && syncUrl && (
                        <span className="sec-badge" style={{ background:'rgba(245,158,11,0.1)', color:'#d97706', border:'1px solid rgba(245,158,11,0.2)', fontSize:9 }}>
                          <I.Key style={{width:9,height:9}} /> Kredensial
                        </span>
                      )}
                    </div>

                    {/* Creds panel */}
                    {isCredOpen && syncUrl && sessionPin && link.hasCreds && (
                      <div className="anim-up" style={{ padding:12, background:'var(--paper2)', borderRadius:10, border:'1px solid var(--border)', fontSize:13 }}>
                        {[['User/Email', link.encUser, 'User'], ['Password', link.encPass, 'Password']].map(([label, enc, copyLabel]) => {
                          const val = decrypt(enc, sessionPin, encMeta.salt);
                          const isPwField = label === 'Password';
                          const isShown = showPw[link.id + label];
                          return (
                            <div key={label} style={{ marginBottom: label === 'User/Email' ? 8 : 0 }}>
                              <div style={{ fontSize:10, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:4 }}>{label}</div>
                              <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                                <div className="cred-reveal" style={{ flex:1, fontSize:12 }}>
                                  {isPwField && !isShown ? '•'.repeat(Math.min(val.length, 12)) : (val || '(kosong)')}
                                </div>
                                {isPwField && (
                                  <button className="btn-ghost" style={{ padding:'5px 8px', flexShrink:0 }}
                                    onClick={() => setShowPw(p => ({ ...p, [link.id + label]: !isShown }))}>
                                    {isShown ? <I.EyeOff style={{width:13,height:13}} /> : <I.Eye style={{width:13,height:13}} />}
                                  </button>
                                )}
                                <button className="btn-ghost" style={{ padding:'5px 8px', flexShrink:0 }} onClick={() => copy(val, copyLabel)}>
                                  <I.Copy style={{width:13,height:13}} />
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* Actions */}
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:'auto', paddingTop:4, borderTop:'1px solid var(--border)' }}>
                      <div style={{ display:'flex', gap:4 }}>
                        <a href={link.url} target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{ padding:'6px 10px', fontSize:12, textDecoration:'none' }}>
                          <I.Link style={{width:13,height:13}} /> Buka
                        </a>
                        <button className="btn-ghost" style={{ padding:'6px 10px' }} onClick={() => copy(link.url, 'URL')} title="Salin URL">
                          <I.Copy style={{width:13,height:13}} />
                        </button>
                        {syncUrl && sessionPin && link.hasCreds && (
                          <button className="btn-ghost" style={{ padding:'6px 10px', color: isCredOpen ? '#d97706' : undefined, borderColor: isCredOpen ? '#d97706' : undefined }}
                            onClick={() => setActiveCredId(isCredOpen ? null : link.id)} title="Lihat Kredensial">
                            <I.Key style={{width:13,height:13}} />
                          </button>
                        )}
                      </div>
                      <div style={{ display:'flex', gap:2 }}>
                        <button className="btn-ghost" style={{ padding:'6px 8px', color: link.pinned ? '#f59e0b' : undefined }}
                          onClick={() => togglePin(link.id)} title={link.pinned ? 'Lepas Pin' : 'Sematkan'}>
                          <I.Star style={{width:13,height:13}} filled={link.pinned} />
                        </button>
                        <button className="btn-ghost" style={{ padding:'6px 8px' }} onClick={() => openEdit(link)} title="Edit">
                          <I.Edit style={{width:13,height:13}} />
                        </button>
                        <button className="btn-ghost" style={{ padding:'6px 8px', color:'var(--accent)' }} onClick={() => deleteLink(link.id)} title="Hapus">
                          <I.Trash style={{width:13,height:13}} />
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </main>

      {/* ════════════ MODALS ════════════ */}

      {/* ── LINK MODAL ── */}
      {modal === 'link' && (
        <div className="modal-overlay anim-in" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal-box anim-up">
            <div style={{ padding:'20px 24px 16px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <h3 className="font-display" style={{ fontSize:18 }}>{editingLink ? 'Edit Link' : 'Tambah Link'}</h3>
              <button className="btn-ghost" style={{ padding:'6px 8px', gap:0 }} onClick={() => setModal(null)}><I.X style={{width:16,height:16}} /></button>
            </div>

            <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
              {/* Title & URL */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>Judul *</label>
                  <input className="input-field" placeholder="Nama tautan" value={form.title} onChange={e => setForm(f => ({...f, title: e.target.value}))} autoFocus />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>URL *</label>
                  <input className="input-field font-mono" placeholder="https://..." value={form.url} onChange={e => setForm(f => ({...f, url: e.target.value}))} />
                </div>
              </div>

              {/* Category & Color */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr auto', gap:12, alignItems:'end' }}>
                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>Kategori</label>
                  <select className="input-field" value={form.cat} onChange={e => setForm(f => ({...f, cat: e.target.value}))}>
                    {cats.filter(c => !c.hidden || c.id === form.cat).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:8 }}>Warna</label>
                  <div style={{ display:'flex', gap:6, alignItems:'center', padding:'8px 12px', background:'var(--paper2)', borderRadius:12, border:'1.5px solid var(--border)' }}>
                    {COLORS.map(c => (
                      <div key={c.id} className={`color-dot ${form.color === c.id ? 'selected' : ''}`}
                        style={{ background: c.dot }} onClick={() => setForm(f => ({...f, color: c.id}))} title={c.id} />
                    ))}
                  </div>
                </div>
              </div>

              {/* Credentials */}
              {syncUrl && sessionPin ? (
                <div style={{ padding:16, background:'rgba(245,158,11,0.06)', borderRadius:14, border:'1px solid rgba(245,158,11,0.2)' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:12 }}>
                    <I.Shield style={{width:13,height:13,color:'#d97706'}} />
                    <span style={{ fontSize:11, fontWeight:700, color:'#d97706', textTransform:'uppercase', letterSpacing:'0.08em' }}>Kredensial (PBKDF2 + AES Encrypted)</span>
                  </div>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                    <div>
                      <label style={{ fontSize:11, color:'var(--muted)', fontWeight:600, display:'block', marginBottom:4 }}>Username / Email</label>
                      <input className="input-field" placeholder="user@email.com" value={form.username} onChange={e => setForm(f => ({...f, username: e.target.value}))} autoComplete="off" />
                    </div>
                    <div>
                      <label style={{ fontSize:11, color:'var(--muted)', fontWeight:600, display:'block', marginBottom:4 }}>Password</label>
                      <div style={{ position:'relative' }}>
                        <input className="input-field font-mono" style={{ paddingRight:38 }}
                          type={showFormPw ? 'text' : 'password'} placeholder="••••••••"
                          value={form.password} onChange={e => setForm(f => ({...f, password: e.target.value}))} autoComplete="new-password" />
                        <button onClick={() => setShowFormPw(v => !v)} style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'var(--muted)' }}>
                          {showFormPw ? <I.EyeOff style={{width:14,height:14}} /> : <I.Eye style={{width:14,height:14}} />}
                        </button>
                      </div>
                      {form.password && (
                        <div style={{ marginTop:6 }}>
                          <div style={{ height:3, background:'var(--border)', borderRadius:99, overflow:'hidden' }}>
                            <div className="strength-bar" style={{ width:`${pwStrength * 20}%`, background: strengthColor(pwStrength) }} />
                          </div>
                          <span style={{ fontSize:10, color: strengthColor(pwStrength), fontWeight:600 }}>{strengthLabel(pwStrength)}</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ) : (
                <div style={{ padding:12, background:'var(--paper2)', borderRadius:12, border:'1px solid var(--border)', display:'flex', alignItems:'center', gap:10 }}>
                  <I.Lock style={{width:16,height:16,color:'var(--muted)',flexShrink:0}} />
                  <div>
                    <p style={{ fontSize:12, fontWeight:600, color:'var(--ink)' }}>Simpan Kredensial</p>
                    <p style={{ fontSize:11, color:'var(--muted)' }}>{syncUrl ? 'Masukkan PIN untuk membuka fitur ini.' : 'Aktifkan Cloud Sync untuk menyimpan username & password terenkripsi.'}</p>
                  </div>
                </div>
              )}

              {/* Tags & Desc */}
              <div>
                <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>Tag (pisah koma)</label>
                <input className="input-field font-mono" placeholder="design, penting, q4..." value={form.tags} onChange={e => setForm(f => ({...f, tags: e.target.value}))} />
              </div>
              <div>
                <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>Deskripsi</label>
                <textarea className="input-field" rows={2} style={{ resize:'none' }} placeholder="Catatan singkat..." value={form.desc} onChange={e => setForm(f => ({...f, desc: e.target.value}))} />
              </div>

              {/* Pin toggle */}
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', paddingTop:8, borderTop:'1px solid var(--border)' }}>
                <div>
                  <p style={{ fontSize:13, fontWeight:600 }}>Sematkan di Atas</p>
                  <p style={{ fontSize:11, color:'var(--muted)' }}>Link akan muncul paling atas</p>
                </div>
                <Switch on={form.pinned} onChange={v => setForm(f => ({...f, pinned: v}))} />
              </div>

              <button className="btn-primary" style={{ width:'100%', justifyContent:'center', padding:'13px' }} onClick={saveLink}>
                <I.Check style={{width:16,height:16}} /> {editingLink ? 'Simpan Perubahan' : 'Tambah Link'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── CATEGORY MODAL ── */}
      {modal === 'cat' && (
        <div className="modal-overlay anim-in" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal-box anim-up">
            <div style={{ padding:'20px 24px 16px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <h3 className="font-display" style={{ fontSize:18 }}>Kelola Kategori</h3>
              <button className="btn-ghost" style={{ padding:'6px 8px', gap:0 }} onClick={() => setModal(null)}><I.X style={{width:16,height:16}} /></button>
            </div>
            <div style={{ padding:24 }}>
              {/* Add new */}
              <div style={{ display:'flex', gap:8, marginBottom:20 }}>
                <input className="input-field" placeholder="Nama kategori baru..." value={newCatName} onChange={e => setNewCatName(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && addCat()} />
                <button className="btn-primary" style={{ flexShrink:0 }} onClick={addCat}><I.Plus style={{width:16,height:16}} /></button>
              </div>
              {/* List */}
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {cats.map(cat => (
                  <div key={cat.id}
                    draggable onDragStart={e => { setDragCatId(cat.id); e.dataTransfer.effectAllowed='move'; }}
                    onDragOver={e => e.preventDefault()} onDrop={() => handleCatDrop(cat.id)} onDragEnd={() => setDragCatId(null)}
                    style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 14px', background:'var(--paper2)', borderRadius:12, border:`1px solid ${dragCatId === cat.id ? 'var(--accent2)' : 'var(--border)'}`, opacity: dragCatId === cat.id ? 0.5 : 1, transition:'all 0.15s' }}>
                    <I.Grip className="drag-handle" style={{width:14,height:14,color:'var(--border)',flexShrink:0}} />
                    {editCatId === cat.id ? (
                      <>
                        <input className="input-field" style={{ flex:1, height:32, padding:'4px 10px', fontSize:13 }} value={editCatVal}
                          onChange={e => setEditCatVal(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') saveEditCat(cat.id); if (e.key === 'Escape') setEditCatId(null); }} autoFocus />
                        <button className="btn-ghost" style={{padding:'4px 10px',fontSize:12}} onClick={() => saveEditCat(cat.id)}>Simpan</button>
                        <button className="btn-ghost" style={{padding:'4px 10px',fontSize:12}} onClick={() => setEditCatId(null)}>Batal</button>
                      </>
                    ) : (
                      <>
                        <span style={{ flex:1, fontSize:14, fontWeight:600, color: cat.hidden ? 'var(--muted)' : 'var(--ink)' }}>{cat.name}</span>
                        <span style={{ fontSize:11, color:'var(--muted)', marginRight:4 }}>{links.filter(l => l.cat === cat.id).length} link</span>
                        <button className="btn-ghost" style={{padding:'4px 8px'}} title={cat.hidden ? 'Tampilkan' : 'Sembunyikan'} onClick={() => toggleHideCat(cat.id)}>
                          {cat.hidden ? <I.Eye style={{width:12,height:12}} /> : <I.EyeOff style={{width:12,height:12}} />}
                        </button>
                        <button className="btn-ghost" style={{padding:'4px 8px'}} title="Edit" onClick={() => { setEditCatId(cat.id); setEditCatVal(cat.name); }}>
                          <I.Edit style={{width:12,height:12}} />
                        </button>
                        <button className="btn-ghost" style={{padding:'4px 8px',color:'var(--accent)'}} title="Hapus" onClick={() => deleteCat(cat.id)}>
                          <I.Trash style={{width:12,height:12}} />
                        </button>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── CLOUD MODAL ── */}
      {modal === 'cloud' && (
        <div className="modal-overlay anim-in" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal-box anim-up">
            <div style={{ padding:'20px 24px 16px', background:'rgba(16,185,129,0.05)', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <I.Cloud style={{width:20,height:20,color:'#10b981'}} />
                <div>
                  <h3 className="font-display" style={{ fontSize:18 }}>{syncUrl ? 'Status Cloud' : 'Sambungkan Cloud'}</h3>
                  <p style={{ fontSize:12, color:'#10b981' }}>Google Apps Script Database</p>
                </div>
              </div>
              <button className="btn-ghost" style={{ padding:'6px 8px', gap:0 }} onClick={() => setModal(null)}><I.X style={{width:16,height:16}} /></button>
            </div>

            {syncUrl ? (
              <div style={{ padding:24 }}>
                <div style={{ marginBottom:20 }}>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>URL Database Aktif</label>
                  <div style={{ display:'flex', gap:8 }}>
                    <input className="input-field font-mono" style={{ fontSize:11, flex:1, opacity:0.6 }} readOnly value={syncUrl} />
                    <button className="btn-ghost" style={{padding:'8px 10px'}} onClick={() => copy(syncUrl, 'URL')}>
                      <I.Copy style={{width:14,height:14}} />
                    </button>
                  </div>
                </div>
                <div style={{ padding:14, background:'rgba(16,185,129,0.08)', borderRadius:12, border:'1px solid rgba(16,185,129,0.2)', marginBottom:20, fontSize:13, color:'#059669', display:'flex', alignItems:'center', gap:8 }}>
                  <I.Check style={{width:14,height:14,flexShrink:0}} />
                  <span>Cloud aktif. Data ter-enkripsi secara end-to-end dengan PBKDF2 + AES.</span>
                </div>
                <button onClick={handleDisconnect} className="btn-ghost" style={{ width:'100%', justifyContent:'center', color:'var(--accent)', borderColor:'var(--accent)', padding:'12px' }}>
                  <I.CloudOff style={{width:15,height:15}} /> Putuskan & Mode Offline
                </button>
              </div>
            ) : (
              <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
                {/* GAS guide collapsible */}
                <details style={{ background:'var(--paper2)', borderRadius:12, border:'1px solid var(--border)', overflow:'hidden' }}>
                  <summary style={{ padding:'12px 16px', cursor:'pointer', fontWeight:600, fontSize:13, listStyle:'none', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    📋 Panduan Setup Google Apps Script
                    <span style={{ color:'var(--muted)', fontSize:12 }}>klik untuk buka</span>
                  </summary>
                  <div style={{ padding:'0 16px 16px', borderTop:'1px solid var(--border)' }}>
                    <ol style={{ fontSize:12, color:'var(--muted)', lineHeight:2, paddingLeft:16, marginTop:12 }}>
                      <li>Buka <a href="https://script.new" target="_blank" style={{ color:'var(--accent2)' }}>script.new</a></li>
                      <li>Tempel kode di bawah ke editor</li>
                      <li>Klik <strong style={{color:'var(--ink)'}}>Deploy → New deployment</strong></li>
                      <li>Tipe: <strong style={{color:'var(--ink)'}}>Web app</strong>, Akses: <strong style={{color:'var(--ink)'}}>Anyone</strong></li>
                      <li>Salin <strong style={{color:'var(--ink)'}}>Web App URL</strong> ke kolom di bawah</li>
                    </ol>
                    <div style={{ marginTop:12, position:'relative' }}>
                      <pre style={{ background:'#0d1117', color:'#7ee787', padding:'14px', borderRadius:10, fontSize:11, overflow:'auto', fontFamily:"'DM Mono', monospace", lineHeight:1.6 }}>{GAS_TEMPLATE}</pre>
                      <button className="btn-ghost" style={{ position:'absolute', top:8, right:8, padding:'4px 10px', fontSize:11 }}
                        onClick={() => copy(GAS_TEMPLATE, 'Kode GAS')}>
                        <I.Copy style={{width:12,height:12}} /> Salin
                      </button>
                    </div>
                  </div>
                </details>

                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>Web App URL *</label>
                  <input className="input-field font-mono" placeholder="https://script.google.com/macros/s/..." value={cloudForm.url} onChange={e => setCloudForm(f => ({...f, url: e.target.value}))} />
                </div>
                <div>
                  <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:6 }}>PIN Keamanan (4-6 karakter) *</label>
                  <input className="input-field font-mono" type="password" style={{ textAlign:'center', letterSpacing:'0.5em', fontSize:20 }}
                    placeholder="••••" maxLength="6" value={cloudForm.pin} onChange={e => setCloudForm(f => ({...f, pin: e.target.value}))} />
                  <p style={{ fontSize:11, color:'var(--muted)', marginTop:6, lineHeight:1.6 }}>PIN ini mengenkripsi semua kredensial Anda. Gunakan PIN yang sama saat menyambung dari perangkat lain.</p>
                </div>
                <button className="btn-primary" style={{ width:'100%', justifyContent:'center', padding:'13px', background:'#10b981', borderColor:'#10b981' }}
                  onClick={handleConnectCloud} disabled={isSyncing}>
                  {isSyncing ? <I.Refresh style={{width:16,height:16}} className="spin" /> : <><I.Cloud style={{width:16,height:16}} /> Sambungkan Sekarang</>}
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── SETTINGS MODAL ── */}
      {modal === 'settings' && (
        <div className="modal-overlay anim-in" onClick={e => e.target === e.currentTarget && setModal(null)}>
          <div className="modal-box anim-up">
            <div style={{ padding:'20px 24px 16px', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <h3 className="font-display" style={{ fontSize:18 }}>Pengaturan</h3>
              <button className="btn-ghost" style={{ padding:'6px 8px', gap:0 }} onClick={() => setModal(null)}><I.X style={{width:16,height:16}} /></button>
            </div>
            <div style={{ padding:24, display:'flex', flexDirection:'column', gap:20 }}>

              {/* Auto-lock */}
              <div>
                <label style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:8 }}>Auto-lock (menit)</label>
                <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                  {[5, 10, 15, 30, 60].map(min => (
                    <button key={min} onClick={() => { setAutoLockMin(min); LS.set('kl_autolock', min); }}
                      className={autoLockMin === min ? 'btn-primary' : 'btn-ghost'} style={{ padding:'7px 16px' }}>
                      {min}m
                    </button>
                  ))}
                </div>
              </div>

              {/* Change PIN */}
              {syncUrl ? (
                <div style={{ padding:16, background:'var(--paper2)', borderRadius:14, border:'1px solid var(--border)' }}>
                  <h4 style={{ fontSize:13, fontWeight:700, marginBottom:14, display:'flex', alignItems:'center', gap:6 }}>
                    <I.Key style={{width:14,height:14,color:'#d97706'}} /> Ganti PIN & Re-enkripsi
                  </h4>
                  <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                    {[['oldPin','PIN Lama'], ['newPin','PIN Baru (4-6 Karakter)'], ['confirmPin','Konfirmasi PIN Baru']].map(([field, label]) => (
                      <div key={field} style={{ position:'relative' }}>
                        <input className="input-field font-mono" style={{ textAlign:'center', letterSpacing:'0.4em', fontSize:16 }}
                          type={showSettingsPw[field] ? 'text' : 'password'} placeholder="••••" maxLength="6"
                          value={settingsForm[field]} onChange={e => setSettingsForm(f => ({...f, [field]: e.target.value}))} />
                        <label style={{ fontSize:11, color:'var(--muted)', display:'block', marginTop:3, textAlign:'center' }}>{label}</label>
                        <button onClick={() => setShowSettingsPw(p => ({...p, [field]: !p[field]}))}
                          style={{ position:'absolute', right:10, top:12, background:'none', border:'none', cursor:'pointer', color:'var(--muted)' }}>
                          {showSettingsPw[field] ? <I.EyeOff style={{width:14,height:14}} /> : <I.Eye style={{width:14,height:14}} />}
                        </button>
                      </div>
                    ))}
                    <button className="btn-primary" style={{ justifyContent:'center', padding:'11px', background:'#d97706', borderColor:'#d97706', marginTop:4 }} onClick={handleChangePin}>
                      Perbarui & Enkripsi Ulang Semua Data
                    </button>
                  </div>
                </div>
              ) : (
                <div style={{ padding:14, background:'var(--paper2)', borderRadius:12, border:'1px solid var(--border)', display:'flex', gap:10, alignItems:'center' }}>
                  <I.Lock style={{width:16,height:16,color:'var(--muted)',flexShrink:0}} />
                  <p style={{ fontSize:13, color:'var(--muted)' }}>Sambungkan Cloud untuk mengaktifkan fitur PIN & enkripsi.</p>
                </div>
              )}

              {/* Backup */}
              <div style={{ padding:16, background:'var(--paper2)', borderRadius:14, border:'1px solid var(--border)' }}>
                <h4 style={{ fontSize:13, fontWeight:700, marginBottom:6 }}>Backup & Restore</h4>
                <p style={{ fontSize:12, color:'var(--muted)', marginBottom:12, lineHeight:1.6 }}>Ekspor semua data (termasuk enkripsi) sebagai file .json untuk backup atau perpindahan perangkat.</p>
                <div style={{ display:'flex', gap:8 }}>
                  <button className="btn-ghost" style={{ flex:1, justifyContent:'center' }} onClick={handleExport}>
                    <I.Download style={{width:14,height:14}} /> Ekspor
                  </button>
                  <label className="btn-ghost" style={{ flex:1, justifyContent:'center', cursor:'pointer' }}>
                    <I.Upload style={{width:14,height:14}} /> Impor
                    <input type="file" accept=".json" style={{ display:'none' }} onChange={handleImport} />
                  </label>
                </div>
              </div>

              {/* Stats */}
              <div style={{ padding:14, background:'var(--paper2)', borderRadius:12, border:'1px solid var(--border)', display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, textAlign:'center' }}>
                {[['Total Link', links.length], ['Kategori', cats.length], ['Dengan Creds', links.filter(l=>l.hasCreds).length]].map(([label, val]) => (
                  <div key={label}>
                    <div className="font-display" style={{ fontSize:22, fontWeight:800 }}>{val}</div>
                    <div style={{ fontSize:11, color:'var(--muted)', fontWeight:600 }}>{label}</div>
                  </div>
                ))}
              </div>

            </div>
          </div>
        </div>
      )}

      {/* ── TOAST ── */}
      {toast && <Toast msg={toast.msg} type={toast.type} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
